version: "5.1.4"

services:
  postgressql-userservice:
    image: postgres:18.0
    container_name: postgressql-userservice
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: commercefabricUsers
    ports:
      - "5432:5432"
    volumes:
      - ./Resources/docker/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - commercefabric-network
    restart: unless-stopped

  userservice:
    image: danielmusselwhite/commercefabric_user_microservice:${USER_VERSION}
    container_name: userservice
    ports:
      - "9090:8080"
    networks:
      - commercefabric-network
    depends_on:
      - postgressql-userservice
    restart: unless-stopped

  mysql-productservice:
    image: mysql:9.7.1
    container_name: mysql-productservice
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: productDB
    ports:
      - "3306:3306"
    volumes:
      - ./Resources/docker/mysql-init:/docker-entrypoint-initdb.d
    networks:
      - commercefabric-network
    restart: unless-stopped

  productservice:
    image: danielmusselwhite/commercefabric_product_microservice:${PRODUCT_VERSION}
    container_name: productservice
    ports:
      - "8080:8080"
    networks:
      - commercefabric-network
    depends_on:
      - mysql-productservice
    restart: unless-stopped

  mongodb-orderservice:
    image: mongo:8.3.7
    container_name: mongodb-orderservice
    ports:
      - "27017:27017"
    volumes:
      - ./Resources/docker/mongodb-init/orders_mongoDB_init.js:/docker-entrypoint-initdb.d/orders_mongoDB_init.js:ro
    networks:
      - commercefabric-network
    restart: unless-stopped

  orderservice:
    image: danielmusselwhite/commercefabric_order_microservice:${ORDER_VERSION}
    container_name: orderservice
    ports:
      - "7070:8080"
    environment:
      - USERS_MICROSERVICE_HOST=apigateway
      - USERS_MICROSERVICE_PORT=8080
      - USERS_MICROSERVICE_SCHEME=http
      - PRODUCTS_MICROSERVICE_HOST=apigateway
      - PRODUCTS_MICROSERVICE_PORT=8080
      - PRODUCTS_MICROSERVICE_SCHEME=http
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin
      - RABBITMQ_PRODUCTS_EXCHANGE=products.exchange
      - ORDERS_MONGODB_HOST=mongodb-orderservice
      - ORDERS_MONGODB_PORT=27017
      - MONGODB_DATABASE=OrdersDb
    networks:
      - commercefabric-network
    depends_on:
      - mongodb-orderservice
      - redis
      - rabbitmq
    restart: unless-stopped

  apigateway:
    image: danielmusselwhite/commercefabric_api_gateway:${API_GATEWAY_VERSION}
    container_name: apigateway
    ports:
      - "4000:8080"
    networks:
      - commercefabric-network
    depends_on:
      - userservice
      - productservice
    restart: unless-stopped

  redis:
    image: redis:8.10.0
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./Resources/docker/redis-data:/data
    networks:
      - commercefabric-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    networks:
      - commercefabric-network
    restart: unless-stopped

networks:
  commercefabric-network:
    external: false