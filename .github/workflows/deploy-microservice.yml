name: Deploy Microservice to AKS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Azure environment to deploy to"
        required: true
        type: choice
        default: production
        options:
          - production
          - test

      service:
        description: "Service to deploy (orders/products/users/apigateway)"
        required: true
        type: choice
        options:
          - orders
          - products
          - users
          - apigateway

      image_tag:
        description: "Docker image tag"
        required: true

  repository_dispatch:
    types:
      - deploy-orders
      - deploy-products
      - deploy-user
      - deploy-apigateway


jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      NAMESPACE: commercefabric-namespace
      ROLLOUT_TIMEOUT: 5m


    steps:
      # ============================================================
      # Repository
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # Resolve deployment inputs
      #
      # Supports both:
      #   - manual workflow_dispatch
      #   - repository_dispatch from a microservice CI pipeline
      # ============================================================

      - name: Resolve deployment inputs
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="${{ github.event.client_payload.service || github.event.inputs.service }}"
          IMAGE_TAG="${{ github.event.client_payload.image_tag || github.event.inputs.image_tag }}"

          # repository_dispatch from the microservice repositories
          # defaults to production.
          #
          # Manual workflow_dispatch can explicitly select test.
          ENVIRONMENT="${{ github.event.client_payload.environment || github.event.inputs.environment || 'production' }}"

          if [ -z "$SERVICE" ]; then
            echo "::error::No service was supplied."
            exit 1
          fi

          if [ -z "$IMAGE_TAG" ]; then
            echo "::error::No image tag was supplied."
            exit 1
          fi

          case "$SERVICE" in
            orders|products|users|apigateway)
              ;;
            *)
              echo "::error::Unsupported service '$SERVICE'."
              exit 1
              ;;
          esac

          case "$ENVIRONMENT" in
            production|test)
              ;;
            *)
              echo "::error::Unsupported environment '$ENVIRONMENT'."
              exit 1
              ;;
          esac

          echo "SERVICE=$SERVICE" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_ENV"

          echo "Service: $SERVICE"
          echo "Image tag: $IMAGE_TAG"
          echo "Environment: $ENVIRONMENT"

      - name: Resolve Azure environment
        shell: bash
        run: |
          set -euo pipefail

          if [ "$ENVIRONMENT" = "test" ]; then
            echo "AZURE_RESOURCE_GROUP=CommerceFabric-IaC-Test" >> "$GITHUB_ENV"
            echo "AZURE_AKS_CLUSTER=commercefabric-aks-test" >> "$GITHUB_ENV"
            echo "ACR_NAME=commercefabricregistrytest" >> "$GITHUB_ENV"
            echo "SERVICEBUS_NAMESPACE=commercefabric-servicebus-test" >> "$GITHUB_ENV"
            echo "APIM_NAME=commercefabricapimtest" >> "$GITHUB_ENV"
          else
            echo "AZURE_RESOURCE_GROUP=CommerceFabric-ResourceGroup" >> "$GITHUB_ENV"
            echo "AZURE_AKS_CLUSTER=commercefabric-aks-cluster" >> "$GITHUB_ENV"
            echo "ACR_NAME=commercefabricregistry" >> "$GITHUB_ENV"
            echo "SERVICEBUS_NAMESPACE=commercefabric-servicebus-namespace" >> "$GITHUB_ENV"
            echo "APIM_NAME=commercefabricapimanagement" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # Azure authentication
      # ============================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ============================================================
      # Verify environment
      #
      # A microservice pipeline cannot bootstrap a deleted
      # environment because it needs ACR to exist before it can push
      # its image.
      #
      # deploy-all.yml must be run in bootstrap mode first.
      # ============================================================

      - name: Verify CommerceFabric environment exists
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking CommerceFabric Azure environment..."

          if ! az group show \
            --name "$AZURE_RESOURCE_GROUP" \
            --output none 2>/dev/null; then

            echo "::error::Resource group '$AZURE_RESOURCE_GROUP' does not exist."
            echo "::error::Run the infra-platform Deploy All workflow with bootstrap=true first."
            exit 1
          fi

          if ! az acr show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$ACR_NAME" \
            --output none 2>/dev/null; then

            echo "::error::ACR '$ACR_NAME' does not exist."
            echo "::error::Run the infra-platform Deploy All workflow with bootstrap=true first."
            exit 1
          fi

          if ! az aks show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_AKS_CLUSTER" \
            --output none 2>/dev/null; then

            echo "::error::AKS '$AZURE_AKS_CLUSTER' does not exist."
            echo "::error::Run the infra-platform Deploy All workflow with bootstrap=true first."
            exit 1
          fi

          echo "CommerceFabric environment exists."


      # ============================================================
      # Resolve current ACR login server
      #
      # Avoid hard-coding commercefabricregistry.azurecr.io into the
      # deployment logic.
      # ============================================================

      - name: Get ACR login server
        shell: bash
        run: |
          set -euo pipefail

          ACR_LOGIN_SERVER=$(az acr show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$ACR_NAME" \
            --query loginServer \
            --output tsv)

          if [ -z "$ACR_LOGIN_SERVER" ]; then
            echo "::error::Unable to determine ACR login server."
            exit 1
          fi

          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"

          echo "ACR: $ACR_LOGIN_SERVER"


      # ============================================================
      # Verify requested image exists in ACR
      # ============================================================

      - name: Verify image exists in ACR
        shell: bash
        run: |
          set -euo pipefail

          if [ "$SERVICE" = "apigateway" ]; then
            IMAGE_NAME="apigateway"
          else
            IMAGE_NAME="${SERVICE}-microservice"
          fi

          TAG_EXISTS=$(az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_NAME" \
            --query "[?@=='$IMAGE_TAG'] | length(@)" \
            --output tsv)

          if [ "$TAG_EXISTS" != "1" ]; then
            echo "::error::Image '$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG' does not exist."
            exit 1
          fi

          echo "Image exists: $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"


      # ============================================================
      # Connect kubectl to AKS
      # ============================================================

      - name: Connect to AKS
        shell: bash
        run: |
          set -euo pipefail

          az aks get-credentials \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_AKS_CLUSTER" \
            --overwrite-existing

          kubectl config set-context \
            --current \
            --namespace="$NAMESPACE"


      # ============================================================
      # Verify Kubernetes namespace
      # ============================================================

      - name: Verify Kubernetes namespace exists
        shell: bash
        run: |
          set -euo pipefail

          if ! kubectl get namespace "$NAMESPACE" > /dev/null 2>&1; then
            echo "::error::Kubernetes namespace '$NAMESPACE' does not exist."
            echo "::error::Run deploy-all.yml first."
            exit 1
          fi


      # ============================================================
      # Service Bus
      #
      # Orders and Products consume Azure Service Bus.
      #
      # Retrieve the current connection string directly from Azure
      # instead of storing AZURE_SERVICEBUS_CONNECTION permanently
      # in GitHub.
      # ============================================================

      - name: Get Azure Service Bus connection string
        if: ${{ env.SERVICE == 'orders' || env.SERVICE == 'products' }}
        shell: bash
        run: |
          set -euo pipefail

          CONNECTION_STRING=$(az servicebus namespace authorization-rule keys list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICEBUS_NAMESPACE" \
            --name "RootManageSharedAccessKey" \
            --query primaryConnectionString \
            --output tsv)

          if [ -z "$CONNECTION_STRING" ]; then
            echo "::error::Failed to retrieve Service Bus connection string."
            exit 1
          fi

          echo "::add-mask::$CONNECTION_STRING"
          echo "AZURE_SERVICEBUS_CONNECTION=$CONNECTION_STRING" >> "$GITHUB_ENV"

      - name: Configure Azure Service Bus Kubernetes secret
        if: ${{ env.SERVICE == 'orders' || env.SERVICE == 'products' }}
        shell: bash
        run: |
          set -euo pipefail

          kubectl create secret generic azurebus-microservice-secrets \
            --namespace "$NAMESPACE" \
            --from-literal=AZURE_SERVICEBUS_CONNECTION="$AZURE_SERVICEBUS_CONNECTION" \
            --dry-run=client \
            -o yaml \
            | kubectl apply -f -


      # ============================================================
      # Users Service identity secret
      #
      # The External ID tenant survives normal RG deletion, so its
      # backend client secret remains a GitHub bootstrap secret.
      # ============================================================

      - name: Configure Users Service Kubernetes secret
        if: ${{ env.SERVICE == 'users' }}
        shell: bash
        env:
          ENTRA_CLIENT_SECRET: ${{ secrets.AZURE_ENTRA_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$ENTRA_CLIENT_SECRET" ]; then
            echo "::error::AZURE_ENTRA_CLIENT_SECRET is not configured."
            exit 1
          fi

          kubectl create secret generic users-microservice-secrets \
            --namespace "$NAMESPACE" \
            --from-literal=COMMERCEFABRIC_AZURE_ENTRA_CLIENT_SECRET="$ENTRA_CLIENT_SECRET" \
            --dry-run=client \
            -o yaml \
            | kubectl apply -f -


      # ============================================================
      # Deploy requested service
      # ============================================================

      - name: Deploy Service
        shell: bash
        run: |
          set -euo pipefail

          echo "Deploying service: $SERVICE"
          echo "Image tag: $IMAGE_TAG"

          if [ "$SERVICE" = "apigateway" ]; then

            DEPLOYMENT="apigateway-deployment"
            CONTAINER="apigateway"
            IMAGE_NAME="apigateway"

          else

            DEPLOYMENT="${SERVICE}-microservice-deployment"
            CONTAINER="${SERVICE}-microservice"
            IMAGE_NAME="${SERVICE}-microservice"

          fi

          if ! kubectl get deployment "$DEPLOYMENT" \
            --namespace "$NAMESPACE" \
            > /dev/null 2>&1; then

            echo "::error::Deployment '$DEPLOYMENT' does not exist."
            echo "::error::Run deploy-all.yml first."
            exit 1
          fi

          IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

          echo "Deployment: $DEPLOYMENT"
          echo "Container:  $CONTAINER"
          echo "Image:      $IMAGE"

          kubectl set image \
            "deployment/$DEPLOYMENT" \
            "$CONTAINER=$IMAGE" \
            --namespace "$NAMESPACE"


      # ============================================================
      # Verify rollout
      # ============================================================

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail

          if [ "$SERVICE" = "apigateway" ]; then
            DEPLOYMENT="apigateway-deployment"
          else
            DEPLOYMENT="${SERVICE}-microservice-deployment"
          fi

          kubectl rollout status \
            "deployment/$DEPLOYMENT" \
            --namespace "$NAMESPACE" \
            --timeout="$ROLLOUT_TIMEOUT"

          echo "### ✅ $SERVICE deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag: \`$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # APIM
      #
      # Reconcile the OpenAPI definitions and API policy after a
      # successful application release that changed the apigateway. 
      #
      # This also prepares us for later automatically updating the
      # swagger.json files from each service CI pipeline.
      # ============================================================

      - name: Configure API Management
        if: ${{ env.SERVICE == 'apigateway' }}
        shell: pwsh
        run: |
          ./infra/configure-apim.ps1 `
            -ResourceGroup "$env:AZURE_RESOURCE_GROUP" `
            -ApimName "$env:APIM_NAME" `
            -GatewayServiceName "apigateway"


      # ============================================================
      # Deployment summary
      # ============================================================

      - name: Show deployed workload
        if: always()
        shell: bash
        run: |
          if [ "$SERVICE" = "apigateway" ]; then
            DEPLOYMENT="apigateway-deployment"
          else
            DEPLOYMENT="${SERVICE}-microservice-deployment"
          fi

          echo "=================================================="
          echo "DEPLOYMENT"
          echo "=================================================="

          kubectl get deployment "$DEPLOYMENT" \
            --namespace "$NAMESPACE" \
            -o wide || true

          echo ""
          echo "=================================================="
          echo "PODS"
          echo "=================================================="

          kubectl get pods \
            --namespace "$NAMESPACE" \
            -o wide || true


      # ============================================================
      # Failure diagnostics
      # ============================================================

      - name: Deployment failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "::error::Deployment of '$SERVICE' failed."

          echo ""
          echo "=================================================="
          echo "RECENT EVENTS"
          echo "=================================================="

          kubectl get events \
            --namespace "$NAMESPACE" \
            --sort-by='.lastTimestamp' || true

          echo ""
          echo "=================================================="
          echo "PODS"
          echo "=================================================="

          kubectl get pods \
            --namespace "$NAMESPACE" \
            -o wide || true

          echo ""
          echo "=================================================="
          echo "POD LOGS"
          echo "=================================================="

          kubectl get pods \
            --namespace "$NAMESPACE" \
            -o name 2>/dev/null |
          while read -r pod; do
            [ -z "$pod" ] && continue

            echo ""
            echo "---------------- $pod ----------------"

            kubectl logs \
              "$pod" \
              --namespace "$NAMESPACE" \
              --all-containers=true \
              --tail=100 || true
          done

          echo "## ❌ $SERVICE deployment failed" >> "$GITHUB_STEP_SUMMARY"