name: Deploy to AKS

on:

  workflow_dispatch:

    inputs:

      service:
        description: "Service to deploy"
        required: true

      image_tag:
        description: "Docker image tag"
        required: true


  repository_dispatch:

    types:
      - deploy-orders


jobs:

  deploy:

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


    - name: Connect to AKS
      run: |
        az aks get-credentials \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --name ${{ secrets.AZURE_AKS_CLUSTER }}


    - name: Deploy Orders
      if: ${{ github.event.client_payload.service == 'orders' || github.event.inputs.service == 'orders' }}
      run: |

        kubectl set image \
        deployment/orders-microservice-deployment \
        orders-microservice=commercefabricregistry.azurecr.io/orders-microservice:${{ github.event.client_payload.image_tag || github.event.inputs.image_tag }} \
        -n commercefabric-namespace


    - name: Verify deployment
      run: |

        kubectl rollout status \
        deployment/${{ github.event.client_payload.service || github.event.inputs.service }}-microservice-deployment \
        -n commercefabric-namespace